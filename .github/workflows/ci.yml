name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The tests are fixture-driven and don't need macOS, but porthole only
    # targets macOS ("os": ["darwin"] in package.json), so CI runs where it ships.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
